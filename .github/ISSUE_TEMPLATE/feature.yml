      description: Опишите идею и ожидаемую пользу.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Что входит в область
      description: Нужны ли изменения в модели, протоколе, документации или только в интерфейсе.
  - type: textarea
    id: alt
    attributes:
      label: Альтернативы
      description: Какие способы вы уже рассматривали.
