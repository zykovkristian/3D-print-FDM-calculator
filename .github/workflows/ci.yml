name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Smoke-тест модели
        run: node --test tests/model.test.mjs
      - name: Тест генератора MVS матрицы
        run: node --test tests/mvs-matrix.test.mjs
